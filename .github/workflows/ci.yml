name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: testes (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    env:
      # Sem graphify e sem o CLI claude no runner: os testes que dependem deles pulam ou simulam.
      MODO_DEUS_SEM_GRAPHIFY: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Identidade do git para os repositórios temporários dos testes
        run: |
          git config --global user.email "ci@modo-deus.invalid"
          git config --global user.name "CI modo-deus"
          git config --global init.defaultBranch main

      - name: Ambiente
        run: |
          node --version
          git --version
          command -v graphify || echo "graphify ausente (esperado)"
          command -v claude || echo "claude ausente (esperado)"

      # node-pty traz binário pronto para Windows; no Linux compila (o runner tem python, make e g++).
      - name: Dependências do MCP Orca
        run: npm ci --prefix mcp-orca

      # testes/rodar.mjs monta a lista de arquivos: funciona do node 18 ao 22.
      - name: Testes
        run: npm test
